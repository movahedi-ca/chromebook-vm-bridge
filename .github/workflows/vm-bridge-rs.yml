name: vm-bridge-rs CI

# No paths filter (audit MED-9): changes to agent/, docs/, the systemd unit,
# or this workflow itself must also trigger CI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Unit tests
        run: cargo test

  # Contract tests need a live Chrome + X11, so they run on the VM, not in
  # CI. (There is no rust/tests/ or scripts/run-contract-tests.sh in this
  # repo — the VM-side smoke is: start the service, GET /health, POST
  # /browser/navigate to https://example.com, GET /browser/snapshot.)

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck agent scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './agent'
          severity: warning
