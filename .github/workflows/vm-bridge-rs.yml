name: vm-bridge-rs CI

on:
  push:
    paths:
      - 'rust/**'
  pull_request:
    paths:
      - 'rust/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Unit tests
        run: cargo test

  # Contract tests run on the VM (needs Chrome + X11), not in CI.
  # See rust/tests/ for the contract suite; run via:
  #   ./scripts/run-contract-tests.sh
