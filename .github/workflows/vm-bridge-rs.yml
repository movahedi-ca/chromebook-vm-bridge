name: vm-bridge-rs CI

# No paths filter (audit MED-9): changes to agent/, docs/, the systemd unit,
# or this workflow itself must also trigger CI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      # Pinned by SHA (audit 42 Medium): tags are mutable refs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        # Pinned by SHA (audit 42 Medium): @stable is a mutable branch.
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        # Pinned by SHA (audit 42 Medium): tags are mutable refs.
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: rust

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --release

      - name: Unit tests
        run: cargo test --locked

      - name: Security audit
        run: |
          # Pinned: reproducible tool version, bumped deliberately
          # (audit 41 LOW-7).
          cargo install --locked cargo-audit --version 0.22.2
          cargo audit
          # Vendored chromiumoxide (audit 41 LOW-13): re-evaluate the
          # vendor/chromiumoxide-conn.patch on every upstream release.
          # This step fails when a newer 0.7.x exists, prompting a re-base.
          LATEST=$(curl -fsSL --max-time 20 https://crates.io/api/v1/crates/chromiumoxide | python3 -c "import json,sys; print(json.load(sys.stdin)['crate']['max_version'])")
          echo "upstream chromiumoxide: $LATEST (vendored: 0.7.0)"
          case "$LATEST" in
            0.7.0) echo "vendored patch is current" ;;
            *) echo "::error::chromiumoxide $LATEST released upstream — re-base vendor/chromiumoxide-conn.patch"; exit 1 ;;
          esac

  # Contract tests need a live Chrome + X11, so they run on the VM, not in
  # CI. (There is no rust/tests/ or scripts/run-contract-tests.sh in this
  # repo — the VM-side smoke is: start the service, GET /health, POST
  # /browser/navigate to https://example.com, GET /browser/snapshot.)

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: ShellCheck agent scripts
        # Pinned to the v2.0.0 commit SHA, not @master (audit 41 LOW-7):
        # @master is a mutable ref and would silently change CI behavior.
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38
        with:
          scandir: './agent'
          severity: warning
